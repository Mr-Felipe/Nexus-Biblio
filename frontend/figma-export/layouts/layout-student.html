<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BiblioLib - Layout Estudiante (Sidebar Abierto)</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: { extend: { colors: { warm: '#F5F2ED', primary: '#1A1A1A' } } }
    }
  </script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  <style>
    body { font-family: "Helvetica Neue", Arial, "Plus Jakarta Sans", "Inter", sans-serif; background-color: #F5F2ED; color: #1A1A1A; margin: 0; padding: 0; -webkit-font-smoothing: antialiased; }
    .font-serif { font-family: Georgia, "Playfair Display", serif; }
    .font-sans { font-family: "Helvetica Neue", Arial, "Plus Jakarta Sans", "Inter", sans-serif; }
    .font-mono { font-family: "JetBrains Mono", monospace; }
    input:focus, select:focus { border-color: #1A1A1A !important; outline: none !important; }
    input, select, textarea { border-radius: 0px !important; }
    ::-webkit-scrollbar { width: 6px; } ::-webkit-scrollbar-track { background: #F5F2ED; } ::-webkit-scrollbar-thumb { background: rgba(26,26,26,0.2); border-radius: 0px; }
    .scrollbar-none::-webkit-scrollbar { display: none; } .scrollbar-none { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body>
  <div class="min-h-screen flex flex-col lg:flex-row">

    <!-- ========== SIDEBAR ESTUDIANTE/DOCENTE (siempre visible) ========== -->
    <aside class="flex-none w-64 bg-[#F5F2ED] border-r-2 border-[#1A1A1A] z-40 flex-col justify-between overflow-y-auto min-h-screen">
      <div>
        <!-- Brand -->
        <div class="h-16 flex flex-col justify-center px-6 border-b border-[#1A1A1A]/10">
          <span class="text-[8px] font-bold tracking-[0.3em] uppercase block text-[#1A1A1A]/50">Fundación Cultural</span>
          <h1 class="font-serif text-lg text-[#1A1A1A] font-bold italic tracking-tight flex items-center gap-2">
            <span class="material-icons text-xl">local_library</span> BiblioLib
          </h1>
        </div>

        <!-- Navigation -->
        <nav class="p-4 space-y-1">
          <!-- Inicio -->
          <button class="w-full flex items-center gap-3 px-4 py-2.5 text-xs text-left transition-all uppercase tracking-widest font-semibold text-[#1A1A1A] hover:opacity-60">
            <span class="material-icons text-lg">home</span> Inicio
          </button>

          <!-- Servicios Estudiantiles Section -->
          <p class="text-[9px] uppercase tracking-[0.25em] text-[#1A1A1A]/50 font-bold px-4 pt-5 pb-1 border-b border-[#1A1A1A]/5 mb-2">Servicios Estudiantiles</p>

          <button class="w-full flex items-center gap-3 px-4 py-2.5 text-xs text-left transition-all uppercase tracking-widest font-semibold bg-[#1A1A1A] text-[#F5F2ED] font-bold">
            <span class="material-icons text-lg">search</span> Catálogo de Libros
          </button>

          <button class="w-full flex items-center gap-3 px-4 py-2.5 text-xs text-left transition-all uppercase tracking-widest font-semibold text-[#1A1A1A] hover:opacity-60">
            <span class="material-icons text-lg">library_books</span> Mis Préstamos
          </button>

          <button class="w-full flex items-center gap-3 px-4 py-2.5 text-xs text-left transition-all uppercase tracking-widest font-semibold text-[#1A1A1A] hover:opacity-60">
            <span class="material-icons text-lg">bookmark</span> Mis Reservas
          </button>

          <button class="w-full flex items-center gap-3 px-4 py-2.5 text-xs text-left transition-all uppercase tracking-widest font-semibold text-[#1A1A1A] hover:opacity-60">
            <span class="material-icons text-lg">report_problem</span> Mis Sanciones
          </button>
        </nav>
      </div>

      <!-- User Footer -->
      <div class="p-4 border-t border-[#1A1A1A]/10 bg-[#1A1A1A]/5">
        <div class="flex items-center gap-3 mb-3">
          <div class="w-10 h-10 bg-[#1A1A1A] text-[#F5F2ED] flex items-center justify-center font-bold text-sm border border-[#1A1A1A]">JP</div>
          <div>
            <h4 class="text-xs font-bold text-[#1A1A1A] truncate w-36 font-serif">Juan Pérez</h4>
            <span class="text-[9px] uppercase font-bold px-2 py-0.5 border border-[#1A1A1A]/20 text-[#1A1A1A]/70 inline-block mt-0.5">EST</span>
          </div>
        </div>
        <button class="w-full flex items-center justify-center gap-2 py-2 text-[10px] uppercase tracking-widest border border-[#1A1A1A]/20 hover:bg-[#1A1A1A] hover:text-[#F5F2ED] text-[#1A1A1A] transition-all font-bold cursor-pointer">
          <span class="material-icons text-sm">logout</span> Cerrar Sesión
        </button>
      </div>
    </aside>

    <!-- ========== MAIN BODY ========== -->
    <div class="flex-1 flex flex-col min-w-0 bg-[#F5F2ED] relative">

      <!-- NAVBAR -->
      <header class="min-h-16 py-2 border-b-2 border-[#1A1A1A] bg-[#F5F2ED] flex items-center px-4 lg:px-6 z-30 sticky top-0 gap-2 lg:gap-4">
        <div class="flex items-center gap-2 flex-shrink-0">
          <!-- Brand logo (navbar) -->
          <div class="flex items-center gap-2 mr-2">
            <span class="material-icons text-[#1A1A1A] text-lg">local_library</span>
            <span class="font-serif text-sm font-bold italic tracking-tight text-[#1A1A1A]">BiblioLib</span>
          </div>
        </div>

        <!-- Desktop Navigation Links -->
        <nav class="flex items-center gap-0.5 xl:gap-1 mr-auto overflow-x-auto flex-nowrap scrollbar-none">
          <button class="px-2 py-1.5 text-[9px] xl:text-[10px] uppercase tracking-wider font-bold transition-all whitespace-nowrap cursor-pointer flex-shrink-0 bg-[#1A1A1A] text-[#F5F2ED]">Catálogo</button>
          <button class="px-2 py-1.5 text-[9px] xl:text-[10px] uppercase tracking-wider font-bold transition-all whitespace-nowrap cursor-pointer flex-shrink-0 text-[#1A1A1A] hover:bg-[#1A1A1A]/10">Mis Préstamos</button>
          <button class="px-2 py-1.5 text-[9px] xl:text-[10px] uppercase tracking-wider font-bold transition-all whitespace-nowrap cursor-pointer flex-shrink-0 text-[#1A1A1A] hover:bg-[#1A1A1A]/10">Mis Reservas</button>
          <button class="px-2 py-1.5 text-[9px] xl:text-[10px] uppercase tracking-wider font-bold transition-all whitespace-nowrap cursor-pointer flex-shrink-0 text-[#1A1A1A] hover:bg-[#1A1A1A]/10">Mis Sanciones</button>
        </nav>

        <!-- Right Side Actions -->
        <div class="flex items-center gap-2 lg:gap-3 flex-shrink-0">
          <!-- Notifications -->
          <button class="p-2 text-[#1A1A1A] hover:bg-[#1A1A1A]/5 transition-all relative cursor-pointer">
            <span class="material-icons text-xl">notifications</span>
          </button>

          <!-- Date -->
          <div class="hidden xl:flex items-center gap-1.5 px-3 py-1 bg-transparent border border-[#1A1A1A]/20 text-[10px] uppercase tracking-widest font-bold">
            <span class="material-icons text-xs text-[#1A1A1A]/70">calendar_today</span>
            <span class="font-mono text-[#1A1A1A]/70">2026-07-15</span>
          </div>

          <!-- User Menu -->
          <div class="hidden lg:flex items-center gap-2 border-l border-[#1A1A1A]/20 pl-3">
            <div class="flex items-center gap-2">
              <div class="w-8 h-8 bg-[#1A1A1A] text-[#F5F2ED] flex items-center justify-center font-bold text-xs border border-[#1A1A1A]">JP</div>
              <div class="text-left leading-tight">
                <p class="text-[10px] font-bold text-[#1A1A1A] max-w-[100px] truncate font-serif">Juan Pérez</p>
                <span class="text-[8px] uppercase font-mono font-bold text-[#1A1A1A]/60">EST</span>
              </div>
            </div>
            <button class="p-1 text-[#1A1A1A]/60 hover:text-red-600 transition-colors cursor-pointer" title="Cerrar Sesión">
              <span class="material-icons text-sm">logout</span>
            </button>
          </div>
        </div>
      </header>

      <!-- CONTENT (placeholder) -->
      <main class="flex-1 p-6 overflow-y-auto">
        <div class="space-y-6">
          <h1 class="font-serif text-3xl text-[#1A1A1A] font-bold tracking-tight">Catálogo Universitario</h1>
          <p class="text-xs text-[#1A1A1A]/60 font-serif italic">Contenido de la vista activa aquí...</p>
        </div>
      </main>
    </div>
  </div>
</body>
</html>

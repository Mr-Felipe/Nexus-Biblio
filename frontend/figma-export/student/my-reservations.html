<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BiblioLib - Mis Reservas</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: { extend: { colors: { warm: '#F5F2ED', primary: '#1A1A1A' } } }
    }
  </script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  <style>
    body { font-family: "Helvetica Neue", Arial, "Plus Jakarta Sans", "Inter", sans-serif; background-color: #F5F2ED; color: #1A1A1A; margin: 0; padding: 0; -webkit-font-smoothing: antialiased; }
    .font-serif { font-family: Georgia, "Playfair Display", serif; }
    .font-sans { font-family: "Helvetica Neue", Arial, "Plus Jakarta Sans", "Inter", sans-serif; }
    .font-mono { font-family: "JetBrains Mono", monospace; }
    input:focus, select:focus { border-color: #1A1A1A !important; outline: none !important; }
    input, select, textarea { border-radius: 0px !important; }
    ::-webkit-scrollbar { width: 6px; } ::-webkit-scrollbar-track { background: #F5F2ED; } ::-webkit-scrollbar-thumb { background: rgba(26,26,26,0.2); border-radius: 0px; }
    .scrollbar-none::-webkit-scrollbar { display: none; } .scrollbar-none { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body>
  <div class="min-h-screen flex flex-col">

    <div class="flex-1 flex flex-col min-w-0 bg-[#F5F2ED] relative">
      <header class="min-h-16 py-2 border-b-2 border-[#1A1A1A] bg-[#F5F2ED] flex items-center px-4 lg:px-6 z-30 sticky top-0 gap-2 lg:gap-4">
        <div class="flex items-center gap-2 flex-shrink-0"><div class="flex items-center gap-2 mr-2"><span class="material-icons text-[#1A1A1A] text-lg">local_library</span><span class="font-serif text-sm font-bold italic tracking-tight text-[#1A1A1A]">BiblioLib</span></div></div>
        <nav class="flex items-center gap-0.5 xl:gap-1 mr-auto overflow-x-auto flex-nowrap scrollbar-none">
          <button class="px-2 py-1.5 text-[9px] xl:text-[10px] uppercase tracking-wider font-bold whitespace-nowrap cursor-pointer flex-shrink-0 text-[#1A1A1A] hover:bg-[#1A1A1A]/10">Catálogo</button>
          <button class="px-2 py-1.5 text-[9px] xl:text-[10px] uppercase tracking-wider font-bold whitespace-nowrap cursor-pointer flex-shrink-0 text-[#1A1A1A] hover:bg-[#1A1A1A]/10">Mis Préstamos</button>
          <button class="px-2 py-1.5 text-[9px] xl:text-[10px] uppercase tracking-wider font-bold whitespace-nowrap cursor-pointer flex-shrink-0 bg-[#1A1A1A] text-[#F5F2ED]">Mis Reservas</button>
          <button class="px-2 py-1.5 text-[9px] xl:text-[10px] uppercase tracking-wider font-bold whitespace-nowrap cursor-pointer flex-shrink-0 text-[#1A1A1A] hover:bg-[#1A1A1A]/10">Mis Sanciones</button>
        </nav>
        <div class="flex items-center gap-2 lg:gap-3 flex-shrink-0">
          <div class="flex items-center gap-2 border-l border-[#1A1A1A]/20 pl-3">
            <div class="flex items-center gap-2"><div class="w-8 h-8 bg-[#1A1A1A] text-[#F5F2ED] flex items-center justify-center font-bold text-xs border border-[#1A1A1A]">JP</div><div class="text-left leading-tight"><p class="text-[10px] font-bold text-[#1A1A1A] max-w-[100px] truncate font-serif">Juan Pérez</p><span class="text-[8px] uppercase font-mono font-bold text-[#1A1A1A]/60">EST</span></div></div>
          </div>
        </div>
      </header>

      <main class="flex-1 p-6 overflow-y-auto">
        <div class="space-y-6">
          <h1 class="font-serif text-3xl text-[#1A1A1A] font-bold tracking-tight">Mis Reservas</h1>

          <div class="border-2 border-[#1A1A1A] p-6 bg-transparent">
            <h3 class="text-xs font-bold uppercase tracking-wider text-[#1A1A1A] mb-4">Apartados Vigentes</h3>
            <div class="space-y-4">
              <!-- Ready for pickup -->
              <div class="p-4 border-2 border-[#1A1A1A] bg-transparent flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3">
                <div>
                  <h4 class="font-serif font-bold text-[#1A1A1A] uppercase tracking-wide text-sm">Cien años de soledad</h4>
                  <p class="text-[10px] text-[#1A1A1A]/60 font-mono mt-0.5">ISBN: 978-0060883287 — Apartado el: 2026-07-10</p>
                </div>
                <div class="flex items-center gap-3 w-full sm:w-auto justify-between sm:justify-end">
                  <div>
                    <span class="text-[10px] text-[#1A1A1A] font-bold border-2 border-[#1A1A1A] px-3 py-1 flex items-center gap-1 uppercase tracking-wider bg-[#1A1A1A] text-[#F5F2ED]"><span class="material-icons text-sm">check_circle</span> ¡Listo en mostrador!</span>
                  </div>
                  <div class="flex items-center gap-2">
                    <button class="text-[9px] text-[#F5F2ED] bg-[#1A1A1A] border border-[#1A1A1A] hover:bg-[#1A1A1A]/80 px-3 py-1.5 font-bold uppercase tracking-wider cursor-pointer transition-all flex items-center gap-1"><span class="material-icons text-xs">assignment_turned_in</span> Reclamar / Retirar</button>
                    <button class="text-[9px] text-red-600 border border-red-200 hover:bg-red-50 hover:border-red-400 px-3 py-1.5 font-bold uppercase tracking-wider cursor-pointer transition-all">Cancelar Reserva</button>
                  </div>
                </div>
              </div>

              <!-- In queue -->
              <div class="p-4 border-2 border-[#1A1A1A] bg-transparent flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3">
                <div>
                  <h4 class="font-serif font-bold text-[#1A1A1A] uppercase tracking-wide text-sm">1984</h4>
                  <p class="text-[10px] text-[#1A1A1A]/60 font-mono mt-0.5">ISBN: 978-0451524935 — Apartado el: 2026-07-12</p>
                </div>
                <div class="flex items-center gap-3 w-full sm:w-auto justify-between sm:justify-end">
                  <div>
                    <span class="text-[10px] text-[#1A1A1A]/70 font-bold border border-[#1A1A1A] px-3 py-1 flex items-center gap-1 uppercase tracking-wider"><span class="material-icons text-sm">hourglass_full</span> En cola de espera (Pos: 2)</span>
                  </div>
                  <div class="flex items-center gap-2">
                    <button class="text-[9px] text-red-600 border border-red-200 hover:bg-red-50 hover:border-red-400 px-3 py-1.5 font-bold uppercase tracking-wider cursor-pointer transition-all">Cancelar Reserva</button>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </main>
    </div>
  </div>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BiblioLib - Login</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            warm: '#F5F2ED',
            primary: '#1A1A1A',
          }
        }
      }
    }
  </script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  <style>
    body { font-family: "Helvetica Neue", Arial, "Plus Jakarta Sans", "Inter", sans-serif; background-color: #F5F2ED; color: #1A1A1A; margin: 0; padding: 0; -webkit-font-smoothing: antialiased; }
    .font-serif { font-family: Georgia, "Playfair Display", serif; }
    .font-sans { font-family: "Helvetica Neue", Arial, "Plus Jakarta Sans", "Inter", sans-serif; }
    .font-mono { font-family: "JetBrains Mono", monospace; }
    input:focus { border-color: #1A1A1A !important; outline: none !important; box-shadow: none !important; }
    input, select, textarea { border-radius: 0px !important; }
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: #F5F2ED; }
    ::-webkit-scrollbar-thumb { background: rgba(26,26,26,0.2); border-radius: 0px; }
  </style>
</head>
<body>
  <!-- LOGIN PAGE -->
  <div class="min-h-screen flex flex-col justify-center items-center px-4 bg-[#F5F2ED] py-12 relative overflow-hidden">
    <!-- Decorative background watermark -->
    <div class="absolute inset-0 flex items-center justify-center opacity-[0.03] select-none pointer-events-none">
      <span class="font-serif text-[180px] font-bold tracking-tighter">ARCHIVO</span>
    </div>

    <div class="w-full max-w-md bg-[#F5F2ED] border-2 border-[#1A1A1A] p-10 relative z-10">
      <!-- Login Form -->
      <div class="text-center mb-8">
        <span class="text-[9px] font-bold tracking-[0.3em] uppercase block text-[#1A1A1A]/60 mb-2">Fundación Académica</span>
        <h1 class="font-serif text-4xl text-[#1A1A1A] font-bold tracking-tight italic flex items-center justify-center gap-2">
          <span class="material-icons text-3xl">local_library</span> BiblioLib
        </h1>
        <p class="text-[10px] text-[#1A1A1A]/60 tracking-[0.2em] uppercase font-semibold mt-3">Sistema de Gestión & Archivo</p>
      </div>

      <form class="space-y-6">
        <div>
          <span class="block text-[10px] font-bold text-[#1A1A1A] uppercase tracking-widest mb-2">ID de Usuario</span>
          <div class="relative border-b border-[#1A1A1A] pb-1">
            <span class="material-icons absolute left-1 top-2 text-[#1A1A1A]/50 text-lg">person</span>
            <input type="text" placeholder="Ej. 1001"
                   class="w-full pl-8 pr-2 py-1.5 text-xs bg-transparent border-0 focus:outline-none focus:ring-0 text-[#1A1A1A]" />
          </div>
        </div>

        <div>
          <span class="block text-[10px] font-bold text-[#1A1A1A] uppercase tracking-widest mb-2">Contraseña</span>
          <div class="relative border-b border-[#1A1A1A] pb-1">
            <span class="material-icons absolute left-1 top-2 text-[#1A1A1A]/50 text-lg">lock</span>
            <input type="password" placeholder="••••••••"
                   class="w-full pl-8 pr-10 py-1.5 text-xs bg-transparent border-0 focus:outline-none focus:ring-0 text-[#1A1A1A]" />
            <button type="button" class="absolute right-1 top-1.5 text-[#1A1A1A]/50 hover:text-[#1A1A1A]">
              <span class="material-icons text-lg">visibility</span>
            </button>
          </div>
        </div>

        <button type="submit"
                class="w-full bg-[#1A1A1A] hover:bg-black text-[#F5F2ED] font-bold text-xs uppercase tracking-[0.2em] py-3 shadow-none transition-all flex items-center justify-center gap-2 cursor-pointer border border-[#1A1A1A]">
          <span class="material-icons text-sm">login</span> Ingresar a BiblioLib
        </button>
      </form>

      <div class="mt-4 text-center">
        <button class="text-[10px] font-bold text-[#1A1A1A]/60 hover:text-[#1A1A1A] uppercase tracking-widest transition-all cursor-pointer underline underline-offset-2">
          ¿No tienes cuenta? Regístrate aquí
        </button>
      </div>

      <!-- Test Credentials -->
      <div class="mt-8 border-t border-[#1A1A1A]/10 pt-6">
        <p class="text-[10px] font-bold text-[#1A1A1A] mb-3 uppercase tracking-wider flex items-center gap-1">
          <span class="material-icons text-sm">vpn_key</span> Credenciales de prueba:
        </p>
        <div class="grid grid-cols-2 gap-2 text-[10px]">
          <button class="text-left p-3 bg-transparent border border-[#1A1A1A]/20 hover:border-[#1A1A1A] transition-all">
            <span class="font-serif italic font-bold text-[#1A1A1A]">Administrador</span><br/>ID: <span class="font-mono">1001</span>
          </button>
          <button class="text-left p-3 bg-transparent border border-[#1A1A1A]/20 hover:border-[#1A1A1A] transition-all">
            <span class="font-serif italic font-bold text-[#1A1A1A]">Bibliotecario</span><br/>ID: <span class="font-mono">1002</span>
          </button>
          <button class="text-left p-3 bg-transparent border border-[#1A1A1A]/20 hover:border-[#1A1A1A] transition-all">
            <span class="font-serif italic font-bold text-[#1A1A1A]">Docente</span><br/>ID: <span class="font-mono">1003</span>
          </button>
          <button class="text-left p-3 bg-transparent border border-[#1A1A1A]/20 hover:border-[#1A1A1A] transition-all">
            <span class="font-serif italic font-bold text-[#1A1A1A]">Estudiante</span><br/>ID: <span class="font-mono">1004</span>
          </button>
        </div>
      </div>
    </div>
  </div>
</body>
</html>

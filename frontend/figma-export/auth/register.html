<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BiblioLib - Registro</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: { extend: { colors: { warm: '#F5F2ED', primary: '#1A1A1A' } } }
    }
  </script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  <style>
    body { font-family: "Helvetica Neue", Arial, "Plus Jakarta Sans", "Inter", sans-serif; background-color: #F5F2ED; color: #1A1A1A; margin: 0; padding: 0; -webkit-font-smoothing: antialiased; }
    .font-serif { font-family: Georgia, "Playfair Display", serif; }
    .font-mono { font-family: "JetBrains Mono", monospace; }
    input:focus, select:focus { border-color: #1A1A1A !important; outline: none !important; }
    input, select, textarea { border-radius: 0px !important; }
  </style>
</head>
<body>
  <div class="min-h-screen flex flex-col justify-center items-center px-4 bg-[#F5F2ED] py-12 relative overflow-hidden">
    <div class="absolute inset-0 flex items-center justify-center opacity-[0.03] select-none pointer-events-none">
      <span class="font-serif text-[180px] font-bold tracking-tighter">ARCHIVO</span>
    </div>

    <div class="w-full max-w-md bg-[#F5F2ED] border-2 border-[#1A1A1A] p-10 relative z-10">
      <!-- Register Form -->
      <div class="text-center mb-6">
        <span class="text-[9px] font-bold tracking-[0.3em] uppercase block text-[#1A1A1A]/60 mb-2">Nuevo Usuario</span>
        <h1 class="font-serif text-2xl text-[#1A1A1A] font-bold tracking-tight italic flex items-center justify-center gap-2">
          <span class="material-icons text-2xl">person_add</span> Registro
        </h1>
        <p class="text-[10px] text-[#1A1A1A]/60 tracking-[0.15em] uppercase font-semibold mt-2">Crea tu cuenta en BiblioLib</p>
      </div>

      <form class="space-y-4">
        <div>
          <span class="block text-[10px] font-bold text-[#1A1A1A] uppercase tracking-widest mb-1.5">ID de Usuario (Solo Números)</span>
          <div class="relative border-b border-[#1A1A1A] pb-1">
            <span class="material-icons absolute left-1 top-2 text-[#1A1A1A]/50 text-lg">badge</span>
            <input type="text" placeholder="Ej. 2001"
                   class="w-full pl-8 pr-2 py-1.5 text-xs bg-transparent border-0 focus:outline-none focus:ring-0 text-[#1A1A1A]" />
          </div>
        </div>

        <div>
          <span class="block text-[10px] font-bold text-[#1A1A1A] uppercase tracking-widest mb-1.5">Nombre Completo</span>
          <div class="relative border-b border-[#1A1A1A] pb-1">
            <span class="material-icons absolute left-1 top-2 text-[#1A1A1A]/50 text-lg">person</span>
            <input type="text" placeholder="Ej. María García"
                   class="w-full pl-8 pr-2 py-1.5 text-xs bg-transparent border-0 focus:outline-none focus:ring-0 text-[#1A1A1A]" />
          </div>
        </div>

        <div>
          <span class="block text-[10px] font-bold text-[#1A1A1A] uppercase tracking-widest mb-1.5">Correo Electrónico</span>
          <div class="relative border-b border-[#1A1A1A] pb-1">
            <span class="material-icons absolute left-1 top-2 text-[#1A1A1A]/50 text-lg">email</span>
            <input type="email" placeholder="Ej. maria@universidad.edu"
                   class="w-full pl-8 pr-2 py-1.5 text-xs bg-transparent border-0 focus:outline-none focus:ring-0 text-[#1A1A1A]" />
          </div>
        </div>

        <div>
          <span class="block text-[10px] font-bold text-[#1A1A1A] uppercase tracking-widest mb-1.5">Contraseña</span>
          <div class="relative border-b border-[#1A1A1A] pb-1">
            <span class="material-icons absolute left-1 top-2 text-[#1A1A1A]/50 text-lg">lock</span>
            <input type="password" placeholder="Mínimo 4 caracteres"
                   class="w-full pl-8 pr-10 py-1.5 text-xs bg-transparent border-0 focus:outline-none focus:ring-0 text-[#1A1A1A]" />
            <button type="button" class="absolute right-1 top-1.5 text-[#1A1A1A]/50 hover:text-[#1A1A1A]">
              <span class="material-icons text-lg">visibility</span>
            </button>
          </div>
        </div>

        <div>
          <span class="block text-[10px] font-bold text-[#1A1A1A] uppercase tracking-widest mb-1.5">Rol Académico</span>
          <div class="relative border-b border-[#1A1A1A] pb-1">
            <span class="material-icons absolute left-1 top-2 text-[#1A1A1A]/50 text-lg">school</span>
            <select class="w-full pl-8 pr-2 py-1.5 text-xs bg-transparent border-0 focus:outline-none focus:ring-0 text-[#1A1A1A] cursor-pointer">
              <option value="EST">Estudiante</option>
              <option value="DOC">Docente</option>
            </select>
          </div>
        </div>

        <div class="pt-4 space-y-3">
          <button type="submit"
                  class="w-full bg-[#1A1A1A] hover:bg-black text-[#F5F2ED] font-bold text-xs uppercase tracking-[0.2em] py-3 shadow-none transition-all flex items-center justify-center gap-2 cursor-pointer border border-[#1A1A1A]">
            <span class="material-icons text-sm">person_add</span> Crear Cuenta
          </button>
          <button type="button"
                  class="w-full border border-[#1A1A1A]/30 text-[#1A1A1A]/70 hover:text-[#1A1A1A] hover:border-[#1A1A1A] font-bold text-[10px] uppercase tracking-widest py-2.5 transition-all cursor-pointer">
            Volver al Inicio de Sesión
          </button>
        </div>
      </form>
    </div>
  </div>
</body>
</html>

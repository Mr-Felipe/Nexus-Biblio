<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BiblioLib - Modal: Supabase Config</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: { extend: { colors: { warm: '#F5F2ED', primary: '#1A1A1A' } } }
    }
  </script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  <style>
    body { font-family: "Helvetica Neue", Arial, "Plus Jakarta Sans", "Inter", sans-serif; background-color: #F5F2ED; color: #1A1A1A; margin: 0; padding: 0; -webkit-font-smoothing: antialiased; }
    .font-serif { font-family: Georgia, "Playfair Display", serif; }
    .font-mono { font-family: "JetBrains Mono", monospace; }
    input:focus, select:focus { border-color: #1A1A1A !important; outline: none !important; }
    input, select, textarea { border-radius: 0px !important; }
  </style>
</head>
<body>
  <div class="min-h-screen bg-[#F5F2ED] relative">
    <div class="min-h-screen opacity-20 blur-sm pointer-events-none">
      <div class="p-6"><h1 class="font-serif text-3xl text-[#1A1A1A] font-bold">BiblioLib Dashboard</h1></div>
    </div>

    <div class="fixed inset-0 bg-black/50 backdrop-blur-xs flex items-center justify-center p-4 z-50">
      <div class="bg-[#F5F2ED] border-4 border-[#1A1A1A] w-full max-w-lg p-6 relative flex flex-col max-h-[90vh]">
        <div class="flex justify-between items-center pb-4 border-b-2 border-[#1A1A1A] mb-4">
          <h3 class="font-serif text-lg font-bold text-[#1A1A1A] uppercase tracking-tight flex items-center gap-2">
            <span class="material-icons text-xl">database</span> Nexus Corp DB - Supabase
          </h3>
          <button class="text-[#1A1A1A]/60 hover:text-[#1A1A1A] cursor-pointer"><span class="material-icons">close</span></button>
        </div>

        <div class="space-y-4 overflow-y-auto flex-1 pr-2">
          <!-- Connection Status -->
          <div class="border-2 border-[#1A1A1A] p-4 bg-[#1A1A1A]/5 flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
            <div>
              <p class="text-xs font-bold text-[#1A1A1A] uppercase tracking-wide">Estado de la Conexión</p>
              <div class="flex items-center gap-2 mt-1">
                <span class="inline-block w-2.5 h-2.5 rounded-full bg-emerald-500"></span>
                <span class="text-xs font-mono font-bold text-emerald-800 uppercase">Conectado y Sincronizado</span>
              </div>
            </div>
            <div class="flex gap-2 w-full md:w-auto">
              <button class="flex-1 md:flex-initial border-2 border-[#1A1A1A] bg-[#1A1A1A] text-[#F5F2ED] hover:bg-black px-3 py-1.5 text-[10px] uppercase tracking-widest font-bold transition-all flex items-center justify-center gap-1.5 cursor-pointer">
                <span class="material-icons text-xs">sync</span> Re-Conectar
              </button>
              <button class="flex-1 md:flex-initial border-2 border-[#1A1A1A] bg-transparent text-[#1A1A1A] hover:bg-[#1A1A1A]/10 px-3 py-1.5 text-[10px] uppercase tracking-widest font-bold transition-all flex items-center justify-center gap-1.5 cursor-pointer">
                <span class="material-icons text-xs">cloud_upload</span> Sincronizar Locales
              </button>
            </div>
          </div>

          <!-- Project Info -->
          <div class="border border-[#1A1A1A]/20 p-4 text-xs space-y-1 bg-transparent">
            <h4 class="font-serif italic font-bold text-[#1A1A1A] uppercase tracking-wide mb-2 text-[10px]">Credenciales de Base de Datos</h4>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-2 text-[11px] font-mono">
              <div>
                <span class="text-[#1A1A1A]/60 block text-[9px] uppercase font-bold tracking-wider">Proyecto:</span>
                <span class="text-[#1A1A1A] font-semibold">Nexus Corp DB (yedsibiotgjcwkhorifr)</span>
              </div>
              <div>
                <span class="text-[#1A1A1A]/60 block text-[9px] uppercase font-bold tracking-wider">API URL:</span>
                <span class="text-[#1A1A1A] font-semibold truncate block">https://yedsibiotgjcwkhorifr.supabase.co</span>
              </div>
            </div>
          </div>
        </div>

        <div class="pt-4 border-t-2 border-[#1A1A1A] flex justify-end">
          <button class="border-2 border-[#1A1A1A] bg-[#1A1A1A] hover:bg-black text-[#F5F2ED] px-5 py-2 text-xs font-bold uppercase tracking-widest transition-all cursor-pointer">Cerrar Configuración</button>
        </div>
      </div>
    </div>
  </div>
</body>
</html>

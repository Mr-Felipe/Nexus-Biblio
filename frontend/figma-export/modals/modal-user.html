<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BiblioLib - Modal: Registrar Usuario</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: { extend: { colors: { warm: '#F5F2ED', primary: '#1A1A1A' } } }
    }
  </script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  <style>
    body { font-family: "Helvetica Neue", Arial, "Plus Jakarta Sans", "Inter", sans-serif; background-color: #F5F2ED; color: #1A1A1A; margin: 0; padding: 0; -webkit-font-smoothing: antialiased; }
    .font-serif { font-family: Georgia, "Playfair Display", serif; }
    .font-mono { font-family: "JetBrains Mono", monospace; }
    input:focus, select:focus { border-color: #1A1A1A !important; outline: none !important; }
    input, select, textarea { border-radius: 0px !important; }
  </style>
</head>
<body>
  <!-- Simulated modal overlay with blurred background -->
  <div class="min-h-screen bg-[#F5F2ED] relative">
    <!-- Blurred background content -->
    <div class="min-h-screen opacity-20 blur-sm pointer-events-none">
      <div class="p-6"><h1 class="font-serif text-3xl text-[#1A1A1A] font-bold">Gestión de Usuarios</h1></div>
    </div>

    <!-- Modal overlay -->
    <div class="fixed inset-0 bg-black/50 backdrop-blur-xs flex items-center justify-center p-4 z-50">
      <div class="bg-[#F5F2ED] border-4 border-[#1A1A1A] w-full max-w-md p-6 relative">
        <div class="flex justify-between items-center pb-4 border-b-2 border-[#1A1A1A] mb-4">
          <h3 class="font-serif text-lg font-bold text-[#1A1A1A] uppercase tracking-tight">Registrar Nuevo Usuario</h3>
          <button class="text-[#1A1A1A]/60 hover:text-[#1A1A1A] cursor-pointer">
            <span class="material-icons">close</span>
          </button>
        </div>

        <form class="space-y-4">
          <div>
            <span class="block text-[10px] font-bold text-[#1A1A1A] uppercase tracking-wider mb-1">ID de Usuario (Solo Números)</span>
            <input type="text" placeholder="Ej. 1005" class="w-full px-3 py-2.5 text-xs bg-transparent border-2 border-[#1A1A1A] focus:outline-none font-bold uppercase tracking-wide placeholder-[#1A1A1A]/40" />
          </div>
          <div>
            <span class="block text-[10px] font-bold text-[#1A1A1A] uppercase tracking-wider mb-1">Nombre Completo</span>
            <input type="text" placeholder="Ej. Andrea Gómez" class="w-full px-3 py-2.5 text-xs bg-transparent border-2 border-[#1A1A1A] focus:outline-none font-bold uppercase tracking-wide placeholder-[#1A1A1A]/40" />
          </div>
          <div>
            <span class="block text-[10px] font-bold text-[#1A1A1A] uppercase tracking-wider mb-1">Correo Electrónico Institucional</span>
            <input type="email" placeholder="Ej. andrea@bibliolib.edu" class="w-full px-3 py-2.5 text-xs bg-transparent border-2 border-[#1A1A1A] focus:outline-none font-bold uppercase tracking-wide placeholder-[#1A1A1A]/40" />
          </div>
          <div>
            <span class="block text-[10px] font-bold text-[#1A1A1A] uppercase tracking-wider mb-1">Rol Académico</span>
            <select class="w-full px-3 py-2.5 text-xs bg-[#F5F2ED] border-2 border-[#1A1A1A] focus:outline-none font-bold uppercase tracking-wider cursor-pointer">
              <option>Administrador</option><option>Bibliotecario</option><option>Docente</option><option>Estudiante</option>
            </select>
          </div>
          <div class="pt-4 border-t-2 border-[#1A1A1A] flex justify-end gap-2">
            <button type="button" class="border-2 border-[#1A1A1A] px-4 py-2 text-xs text-[#1A1A1A] hover:bg-[#1A1A1A]/10 font-bold uppercase tracking-wider cursor-pointer transition-all">Cancelar</button>
            <button type="submit" class="border-2 border-[#1A1A1A] bg-[#1A1A1A] hover:bg-[#1A1A1A]/80 text-[#F5F2ED] px-4 py-2 text-xs font-bold uppercase tracking-wider transition-all flex items-center gap-1 cursor-pointer">
              <span class="material-icons text-sm">save</span> Guardar Usuario
            </button>
          </div>
        </form>
      </div>
    </div>
  </div>
</body>
</html>
